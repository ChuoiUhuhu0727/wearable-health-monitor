; PlatformIO Project Configuration — Wearable Activity & Health Monitor
; Board: Seeed Studio XIAO ESP32-S3
;
; Source layout (moved 2026-09-15, see CHANGELOG.md):
;   firmware/ble/       -> env:ble               (main firmware: 7 FreeRTOS tasks + BLE + flash logging)
;   firmware/baseline/  -> env:baseline          (single-loop reference build, for latency/RAM comparison)
;   firmware/capture/   -> env:waveform_capture  (standalone raw-waveform demo tool)
;
; build_src_filter paths are relative to src_dir (= firmware/).
; board_build.partitions is relative to this file's directory (repo root).

[platformio]
src_dir = firmware
default_envs = ble

; -----------------------------------------------------------------------
; MAIN FIRMWARE — FreeRTOS 7-task architecture + BLE + LittleFS logging.
; This is the build used for all 18 data-collection sessions and the
; deployed 5-class activity classifier.
; Verify BLE: nRF Connect -> scan for "WearableMonitor" -> subscribe to
; the notify characteristic -> JSON rows stream in.
; -----------------------------------------------------------------------
[env:ble]
platform = espressif32@6.4.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<ble/>
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_build.arduino.memory_type = qio_qspi
; The default scheme sizes LittleFS for a 4MB chip (1.5MB spiffs) even though
; this board has 8MB — measured on-device 2026-07-17, confirmed too small
; for raw waveform capture (~1.6MB/participant). See partitions_ble_8mb.csv.
board_build.partitions = firmware/partitions_ble_8mb.csv
board_upload.flash_size = 8MB
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
monitor_dtr = 1
monitor_rts = 1
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
    h2zero/NimBLE-Arduino @ ^1.4.2

; -----------------------------------------------------------------------
; BASELINE — single-loop, no RTOS. Kept as the measurement reference the
; FreeRTOS redesign was compared against (latency + RAM).
; -----------------------------------------------------------------------
[env:baseline]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<baseline/>
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_build.arduino.memory_type = qio_qspi
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
monitor_dtr = 1
monitor_rts = 1
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2

; -----------------------------------------------------------------------
; WAVEFORM CAPTURE — standalone demo tool, NOT the FreeRTOS pipeline.
; Samples both sensors at 100Hz for ~20s and prints CSV over Serial, so a
; real PPG/accel waveform can be plotted on demand.
; Pair with: python scripts/collect/capture_waveform.py
; -----------------------------------------------------------------------
[env:waveform_capture]
platform = espressif32@6.4.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<capture/>
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_build.arduino.memory_type = qio_qspi
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
monitor_dtr = 1
monitor_rts = 1
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2

; -----------------------------------------------------------------------
