; here as a record of what was tried and why it was parked.
;
; [env:seeed_xiao_esp32s3] / [env:freertos_v1]
;   Built firmware_main/ (WiFi AP + UDP -> Jetson, "Option 4"). Parked
;   2026-07-10: NetworkManager debugging cost more than it returned, and
;   the flash-first architecture made the wireless transport optional.
;   Source: archived/firmware_main_wifi_udp/
;   Server side: archived/jetson_server/
;
; [env:buzzer_test]
;   Isolation test for a buzzer bug fixed 2026-07-07; the hardware buzzer
;   was then disabled entirely (BUZZER_ENABLED=0, 2026-07-14 — sound cues
;   moved to the laptop via log_ble.py + winsound).
;   Source: archived/buzzer_test/
;
; To revive any of them: move the folder back under firmware/ and add an
; env block with build_src_filter = -<*> +<that_folder/>.
; -----------------------------------------------------------------------
